name: 🐞 BUG 报告
description: 报告你在测试中发现的缺陷（教师评审后转成正式工单）
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交！请把复现步骤写到"别人照抄也能重现"的程度。
        已经列在 `BUG-TASKS.md` 里的 5 个已知缺陷**不用重复报**，直接开 PR 修即可。

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - Python 后端（src/iwan_claude）
        - GUI（gui/）
        - TUI（src/iwan_claude/tui）
        - 测试 / CI
        - 文档 / 配置
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 实际发生了什么？和你的期望差在哪？
      placeholder: 例：强杀 GUI 后，~/.iwan/logs/core.log 出现整段 asyncio traceback
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 起 daemon（uv run iwan-core 或 GUI）
        2. 强杀客户端：Get-Process electron | Stop-Process -Force
        3. 看日志尾部：Get-Content "$env:USERPROFILE\.iwan\logs\core.log" -Tail 20
        实际：出现 ConnectionResetError 回溯
        期望：只记一行 warn，不打印 traceback
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境
      value: |
        - Windows 版本：
        - uv / Python：
        - 副本端口（IWAN_PORT）：
        - 复现所用分支/commit：
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志片段（可选）
      description: ⚠️ 粘贴前务必删掉 `sk-` / `gho_` / `ghp_` 开头的任何字符串
      render: text
    validations:
      required: false

  - type: checkboxes
    id: selfcheck
    attributes:
      label: 自查
      options:
        - label: 我已按 TEAM_SETUP.md 配好自己的 API Key，且该缺陷与"没配 Key"无关
          required: true
        - label: 我已在最新 main 上复现过
          required: true
        - label: 我贴的日志里没有任何真实密钥
          required: true
